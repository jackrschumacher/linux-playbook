[machines]
VM ansible_connection=local install_gui=true
MacbookPro-13 ansible_connection=local install_gui=true
rpi5-8 ansible_connection=local install_gui=false
libre-sweetpotato ansible_connection=local install_gui=false
T430 ansible_connection=local install_gui=true
# Ubuntu 26.04 ships sudo-rs as the default `sudo`, which decorates the -p prompt
# ("[sudo: <prompt>] Password:") so Ansible's become plugin never matches it and
# times out. Point become at the classic sudo binary instead.
optiplex-7060 ansible_connection=local install_gui=true ansible_become_exe=/usr/bin/sudo.ws
