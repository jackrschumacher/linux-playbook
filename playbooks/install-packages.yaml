---
- name: Setup Linux enviroment
  hosts: machines
  connection: local
  gather_facts: yes
  become: yes
  vars:
    lazygit_version: "0.61.1"

  tasks:
    - name: Check the state of the system apt cache
      apt:
        update_cache: yes
        cache_valid_time: 1800 #Only check if cache hasnt been checked in last 30 minutes
    - name: Check Snap installation
      ansible.builtin.stat: 
        path: /usr/bin/snap
      register: snap_check
    - name: Ensure GPG dependencies are installed
      apt:
        name: 
          - gnupg
          - dirmngr
        state: present
        update_cache: yes
    - name: Add Fastfetch repository over HTTPS 
      ansible.builtin.shell: |
        mkdir -p /etc/apt/keyrings
        curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x7E2E5CB4D4865F21" | tee /etc/apt/keyrings/fastfetch.asc > /dev/null
        echo "deb [signed-by=/etc/apt/keyrings/fastfetch.asc] https://ppa.launchpadcontent.net/zhangsongcui3371/fastfetch/ubuntu {{ ansible_facts['distribution_release'] }} main" | tee /etc/apt/sources.list.d/fastfetch.list > /dev/null
        apt-get update
      args:
        creates: /etc/apt/sources.list.d/fastfetch.list
      when: ansible_facts['distribution'] == "Ubuntu"
    - name: Install CLI apt packages
      apt:
        pkg:
          - nano
          - micro
          - git
          - python3
          - python3-pip
          - btop
          - iftop
          - tmux
          - vim
          - neovim
          - tree
          - htop
          - atop
          - iotop
          - fastfetch
          - glances
        state: "{{app_state | default('present')}}" # Defaults to "present" instead of updating
    - name: Map system architecture to Lazygit naming convention
      ansible.builtin.set_fact:
        lazygit_arch: >-
          lazygit_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'x86_64' }}"

    - name: Download and extract Lazygit archive
      ansible.builtin.unarchive:
        src: "https://github.com/jesseduffield/lazygit/releases/download/v{{ lazygit_version }}/lazygit_{{ lazygit_version }}_Linux_{{ lazygit_arch }}.tar.gz"
        dest: /usr/local/bin/
        remote_src: yes
        owner: root
        group: root
        mode: '0755'
        creates: /usr/local/bin/lazygit
    - name: Install GUI apt packages
      apt:
        pkg:
          - okular
        state: "{{app_state | default('present')}}"
      when: 
        - install_gui | default (false) | bool
        - snap_check.stat.exists
    - name: Install CLI snap packages
      community.general.snap:
        name:
          - glow
      when:
        - snap_check.stat.exists
    - name: Install GUI snap packages
      community.general.snap:
        name:
          - typora
          - vivaldi
          - logseq
          - zotero-snap
          - todoist
      when: 
        - install_gui | default (false) | bool
        - snap_check.stat.exists
    
    - name: Add repo to keyring and install VS Code 
      ansible.builtin.shell: |
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | tee /etc/apt/keyrings/microsoft.asc > /dev/null
        echo "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/microsoft.asc] https://packages.microsoft.com/repos/code stable main" | tee /etc/apt/sources.list.d/vscode.list > /dev/null
        apt-get update
        apt-get install -y code
      args:
        creates: /usr/bin/code
      when: install_gui | default (false) | bool
    - name: Add repository to keyring and install SourceGit
      ansible.builtin.shell: |
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://codeberg.org/api/packages/yataro/debian/repository.key | tee /etc/apt/keyrings/sourcegit.asc > /dev/null
        echo "deb [signed-by=/etc/apt/keyrings/sourcegit.asc arch=amd64,arm64] https://codeberg.org/api/packages/yataro/debian generic main" | tee /etc/apt/sources.list.d/sourcegit.list > /dev/null
        apt-get update
        apt-get install -y sourcegit
      args:
        creates: /usr/bin/sourcegit
      when: install_gui | default (false) | bool
