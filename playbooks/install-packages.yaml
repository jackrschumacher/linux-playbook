---
- name: Setup Linux enviroment
  hosts: machines
  connection: local
  gather_facts: yes
  become: yes
  vars:
    lazygit_version: "0.61.1"

  tasks:
    - name: Check the state of the system apt cache
      apt:
        update_cache: yes
        cache_valid_time: 1800 #Only check if cache hasnt been checked in last 30 minutes
        
    - name: Check Snap installation
      ansible.builtin.stat: 
        path: /usr/bin/snap
      register: snap_check
      
    - name: Ensure GPG dependencies are installed
      apt:
        name: 
          - gnupg
          - dirmngr
          - ca-certificates
        state: present
        update_cache: yes

    # --- FASTFETCH REPO SETUP ---
    - name: Download Fastfetch GPG key
      ansible.builtin.get_url:
        url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x7E2E5CB4D4865F21"
        dest: /etc/apt/keyrings/fastfetch.asc
        mode: '0644'
        force: true # Forces download if the file is empty/corrupted
      when: ansible_facts['distribution'] == "Ubuntu"

    - name: Add Fastfetch repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/fastfetch.asc] https://ppa.launchpadcontent.net/zhangsongcui3371/fastfetch/ubuntu {{ ansible_facts['distribution_release'] }} main"
        state: present
        filename: fastfetch
      when: ansible_facts['distribution'] == "Ubuntu"

    - name: Install CLI apt packages
      apt:
        pkg:
          - nano
          - micro
          - git
          - python3
          - python3-pip
          - btop
          - iftop
          - tmux
          - vim
          - neovim
          - tree
          - htop
          - atop
          - iotop
          - fastfetch
          - glances
        state: "{{app_state | default('present')}}" # Defaults to "present" instead of updating
        update_cache: yes
        
    - name: Map system architecture to Lazygit naming convention
      ansible.builtin.set_fact:
        lazygit_arch: >-
          lazygit_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'x86_64' }}"

    - name: Download and extract Lazygit archive
      ansible.builtin.unarchive:
        src: "https://github.com/jesseduffield/lazygit/releases/download/v{{ lazygit_version }}/lazygit_{{ lazygit_version }}_Linux_{{ lazygit_arch }}.tar.gz"
        dest: /usr/local/bin/
        remote_src: yes
        owner: root
        group: root
        mode: '0755'
        creates: /usr/local/bin/lazygit
        
    - name: Install GUI apt packages
      apt:
        pkg:
          - okular
        state: "{{app_state | default('present')}}"
      when: 
        - install_gui | default(false) | bool
        - snap_check.stat.exists
        
    - name: Install CLI snap packages
      community.general.snap:
        name:
          - glow
      when:
        - snap_check.stat.exists
        
    - name: Install GUI snap packages
      community.general.snap:
        name:
          - typora
          - vivaldi
          - logseq
          - zotero-snap
          - todoist
      when: 
        - install_gui | default(false) | bool
        - snap_check.stat.exists
    
    # --- VS CODE SETUP ---
    - name: Download VS Code GPG key
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /etc/apt/keyrings/microsoft.asc
        mode: '0644'
        force: true
      when: install_gui | default(false) | bool

    - name: Add VS Code repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/microsoft.asc] https://packages.microsoft.com/repos/code stable main"
        state: present
        filename: vscode
      when: install_gui | default(false) | bool

    - name: Install VS Code
      apt:
        name: code
        state: "{{ app_state | default('present') }}"
        update_cache: yes
      when: install_gui | default(false) | bool

    # --- SOURCEGIT SETUP ---
    - name: Download SourceGit GPG key
      ansible.builtin.get_url:
        url: https://codeberg.org/api/packages/yataro/debian/repository.key
        dest: /etc/apt/keyrings/sourcegit.asc
        mode: '0644'
        force: true
      when: install_gui | default(false) | bool

    - name: Add SourceGit repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/sourcegit.asc arch=amd64,arm64] https://codeberg.org/api/packages/yataro/debian generic main"
        state: present
        filename: sourcegit
      when: install_gui | default(false) | bool

    - name: Install SourceGit
      apt:
        name: sourcegit
        state: "{{ app_state | default('present') }}"
        update_cache: yes
      when: install_gui | default(false) | bool